name: QueryProof V posthoc join-grouping v5
on:
  push:
    branches:
      - research/queryproof-adversarial-tag-frame-20261020
    paths:
      - tools/queryproof_join_filters_u_dev_20261020/join_grouping_v1.py
      - tools/queryproof_join_filters_u_dev_20261020/scope_ledger_v5.py
      - tools/queryproof_join_filters_u_dev_20261020/run_v.py
      - .github/workflows/queryproof-v-posthoc-join-grouping.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_join_filters_u_dev_20261020
            tools/queryproof_join_suffix_s_dev_20261020
            tools/queryproof_join_pruning_q_dev_20261020
            tools/queryproof_round_n_dev_20261020
            tools/queryproof_adversarial_20261020
            tools/queryproof_context_validator
            tools/queryproof_holdout_20261018
            tools/queryproof_external_postgresql_join_20261019
            tools/queryproof_grouping_repetition_round2_20261020
            tools/queryproof_composition_20261020
            tools/queryproof_scopes_20261020
            tools/queryproof_scopes_fresh_k_20261020
            tools/queryproof_state_witness_20261020
            tools/queryproof_state_frame_20261020
            tools/queryproof_instrumented
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate posthoc development syntax and independent algebra controls
        run: |
          python -m py_compile tools/queryproof_join_filters_u_dev_20261020/join_grouping_v1.py
          python -m py_compile tools/queryproof_join_filters_u_dev_20261020/scope_ledger_v5.py
          python -m py_compile tools/queryproof_join_filters_u_dev_20261020/run_v.py
          python -B tools/queryproof_join_filters_u_dev_20261020/test_join_filter_semantics.py
      - name: Install official Spark 4.2.0
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==4.2.0
      - name: Install disposable experimental Catalyst provenance observers
        run: |
          python -B tools/queryproof_scopes_20261020/instrument_scopes.py
          python -B tools/queryproof_state_witness_20261020/instrument_state.py
          python -B tools/queryproof_state_frame_20261020/instrument_frame.py
          python -B tools/queryproof_adversarial_20261020/instrument_input_identity.py
          python -B tools/queryproof_adversarial_20261020/instrument_silent_rules.py
          python -B tools/queryproof_adversarial_20261020/instrument_tag_taxonomy.py
          bash tools/queryproof_instrumented/build_overlay.sh
      - name: Replay known M cases - v5 DEVELOPMENT only
        run: python -u tools/queryproof_join_filters_u_dev_20261020/run_v.py
      - name: Inspect redacted result and reject incomplete observation
        if: always()
        run: |
          python -B -c '
          import json
          from pathlib import Path
          p=Path("artifacts/queryproof_round_v_posthoc_v5.json")
          if not p.is_file(): raise SystemExit("MISSING_V5_REPORT")
          r=json.loads(p.read_text())
          d=r["union_coverage"]["round_v"]
          print("QUERYPROOF_V5_POSTHOC",json.dumps(d,sort_keys=True))
          assert r["executed_cases"]==4 and r["worker_exit_code"]==0
          assert not r["error_cases"] and not r["row_oracle_mismatch_cases"]
          assert d["v5_scope_status"]=="RETROSPECTIVE_EXACT_CATALYST_SCOPE_LEDGER"
          assert not d["v5_scope_errors"]
          assert d["new_v5_complete_suffixes"]>=d["prior_v4_complete_suffixes"]
          assert len(d["grouping_events"])==2
          '
      - name: Preserve sanitized v5 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queryproof-v5-posthoc
          path: artifacts/queryproof_round_v_posthoc_v5.json
          retention-days: 14
          if-no-files-found: warn
