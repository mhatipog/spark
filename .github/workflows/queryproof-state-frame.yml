name: QueryProof actual JVM state frame preservation
on:
  push:
    branches:
      - research/queryproof-generalized-liveness-20261020
    paths:
      - tools/queryproof_state_frame_20261020/**
      - .github/workflows/queryproof-state-frame.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frame-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_context_validator
            tools/queryproof_holdout_20261018
            tools/queryproof_external_postgresql_join_20261019
            tools/queryproof_grouping_repetition_round2_20261020
            tools/queryproof_composition_20261020
            tools/queryproof_scopes_20261020
            tools/queryproof_scopes_fresh_k_20261020
            tools/queryproof_state_witness_20261020
            tools/queryproof_state_frame_20261020
            tools/queryproof_instrumented
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test frame adjacency, local preservation, mutation rejection
        run: |
          PYTHONPATH=tools/queryproof_state_frame_20261020 \
            python -B -m unittest discover \
              -s tools/queryproof_state_frame_20261020 \
              -p 'test_frame_guard.py' -v
          python -B -m unittest discover \
            -s tools/queryproof_state_witness_20261020 \
            -p 'test_state_guard.py' -q
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned PySpark 4.2.0
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==4.2.0
      - name: Build disposable scope, state and SHA-256 frame observer
        run: |
          python -B tools/queryproof_scopes_20261020/instrument_scopes.py
          python -B tools/queryproof_state_witness_20261020/instrument_state.py
          python -B tools/queryproof_state_frame_20261020/instrument_frame.py
          bash tools/queryproof_instrumented/build_overlay.sh
      - name: Replay frozen H cases retrospectively
        run: python -u tools/queryproof_state_frame_20261020/run_frame.py --cohort H
      - name: Replay frozen K cases retrospectively
        run: python -u tools/queryproof_state_frame_20261020/run_frame.py --cohort K
      - name: Verify hidden-frame observer and summarize only counts
        if: always()
        run: |
          python -B -c '
          import json
          from pathlib import Path
          for cohort in ("H", "K"):
              p = Path("artifacts/queryproof_frames_" + cohort + ".json")
              if not p.exists():
                  raise SystemExit("Missing frame analysis for " + cohort)
              report = json.loads(p.read_text())
              u = report["union_coverage"]
              ledger = u["hierarchical_scope_ledger"]
              frame = u["posthoc_frame_preservation"]
              keys = ("status", "errors", "scope_records", "rule_records",
                      "optimizer_suffixes", "postfinish_batch_checks",
                      "frame_violating_batch_reasons",
                      "frame_violating_rule_reasons",
                      "opaque_suffix_boundary_states",
                      "originally_certified_changed_suffixes",
                      "newly_frame_preserved_count", "suffix_failure_reasons",
                      "suffix_failure_case_count")
              print("QUERYPROOF_FRAME_" + cohort, json.dumps({
                  key: frame.get(key) for key in keys}, sort_keys=True))
              print("QUERYPROOF_FRAME_ORACLE_" + cohort, json.dumps({
                  "completed": report["executed_cases"],
                  "errors": report["error_cases"],
                  "mismatches": report["row_oracle_mismatch_cases"],
                  "previous_suffixes": ledger["certified_changed_optimizer_suffixes"],
              }, sort_keys=True))
              if report["worker_exit_code"] != 0 or report["executed_cases"] != 48:
                  raise SystemExit("Incomplete frame replay " + cohort)
              if report["error_cases"] or report["row_oracle_mismatch_cases"]:
                  raise SystemExit("Rowbag mismatch " + cohort)
              if frame["status"] != "COMPLETE_FRAME_COMPARISON":
                  raise SystemExit("Invalid or missing hidden-frame witness " + cohort)
          '
      - name: Store sanitized H/K frame reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queryproof-posthoc-frame-hk
          path: artifacts/queryproof_frames_*.json
          retention-days: 14
          if-no-files-found: warn
