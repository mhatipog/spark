name: QueryProof first prospective O32 generalization holdout
on:
  push:
    branches:
      - research/queryproof-adversarial-tag-frame-20261020
    paths:
      - tools/queryproof_prospective_o_20261020/**
      - .github/workflows/queryproof-prospective-o32.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-o32:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_prospective_o_20261020
            tools/queryproof_round_n_dev_20261020
            tools/queryproof_adversarial_20261020
            tools/queryproof_context_validator
            tools/queryproof_holdout_20261018
            tools/queryproof_external_postgresql_join_20261019
            tools/queryproof_grouping_repetition_round2_20261020
            tools/queryproof_composition_20261020
            tools/queryproof_scopes_20261020
            tools/queryproof_scopes_fresh_k_20261020
            tools/queryproof_state_witness_20261020
            tools/queryproof_state_frame_20261020
            tools/queryproof_instrumented
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify all 32 independent SQL instances and frozen code hash pins
        run: |
          python -B -c '
          import ast, json, subprocess
          from pathlib import Path
          from collections import Counter
          folder=Path("tools/queryproof_prospective_o_20261020")
          m=json.loads((folder/"CASES.json").read_text())
          p=json.loads((folder/"PROTOCOL.json").read_text())
          assert m["benchmark_id"]==p["benchmark_id"]
          assert len(m["cases"])==p["required_case_count"]==32
          assert len(set(c["id"] for c in m["cases"]))==32
          assert Counter(c["group"] for c in m["cases"])==p["cohort_strata"]
          assert len({(c["source_file"],c["source_query_ordinal"]) for c in m["cases"]})==32
          assert p["prospectively_frozen_before_first_o_execution"]
          parent_source=Path("tools/queryproof_external_postgresql_join_20261019/run_external.py")
          parent_ast=ast.parse(parent_source.read_text())
          required={
              node.slice.value for node in ast.walk(parent_ast)
              if isinstance(node,ast.Subscript)
              and isinstance(node.value,ast.Name)
              and node.value.id=="protocol"
              and isinstance(node.slice,ast.Constant)
              and isinstance(node.slice.value,str)
          }
          assert required <= set(p), f"REQUIRED_PROTOCOL_FIELDS_MISSING {sorted(required-set(p))}"
          assert len(p["frozen_verifier_commit"])==40
          compile((folder/"run_o.py").read_text(),str(folder/"run_o.py"),"exec")
          for path,expected in p["frozen_git_blob_shas"].items():
              actual=subprocess.run(["git","hash-object",path],capture_output=True,
                  text=True,check=True).stdout.strip()
              assert actual==expected, f"VERIFIER_PIN_MISMATCH {path}"
              if path.endswith(".py"):
                  compile(Path(path).read_text(),path,"exec")
          print("QUERYPROOF_O_FROZEN",len(m["cases"]),len(p["frozen_git_blob_shas"]),sorted(required))
          '
      - name: Install official Spark 4.2.0
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==4.2.0
      - name: Instrument official disposable Spark optimizer for all witness layers
        run: |
          python -B tools/queryproof_scopes_20261020/instrument_scopes.py
          python -B tools/queryproof_state_witness_20261020/instrument_state.py
          python -B tools/queryproof_state_frame_20261020/instrument_frame.py
          python -B tools/queryproof_adversarial_20261020/instrument_input_identity.py
          python -B tools/queryproof_adversarial_20261020/instrument_silent_rules.py
          python -B tools/queryproof_adversarial_20261020/instrument_tag_taxonomy.py
          bash tools/queryproof_instrumented/build_overlay.sh
      - name: First prospective O32 run without editing checker or corpus
        run: python -u tools/queryproof_prospective_o_20261020/run_o.py
      - name: Enforce 32 real executions and integrity preserving abstentions
        if: always()
        run: |
          python -B -c '
          import json
          from collections import Counter,defaultdict
          from pathlib import Path
          q=Path("artifacts/queryproof_prospective_o32.json")
          if not q.exists(): raise SystemExit("O32_REPORT_MISSING")
          r=json.loads(q.read_text())
          u=r["union_coverage"]
          scope=u["o32_hierarchical_scope_ledger"]
          gate=u["o32_full_frozen_observer_gate"]
          manifest=json.loads(Path("tools/queryproof_prospective_o_20261020/CASES.json").read_text())
          by_case={v["case"]:v for v in scope["optimizer_suffix_case_counts"]}
          cohorts=defaultdict(lambda:Counter())
          for case in manifest["cases"]:
              x=by_case.get(case["id"],{})
              cohorts[case["group"]]["total"]+=1
              cohorts[case["group"]]["certified"]+=bool(x.get("proved") and x.get("changed"))
              cohorts[case["family"]]["total"]+=1
              cohorts[case["family"]]["certified"]+=bool(x.get("proved") and x.get("changed"))
          print("QUERYPROOF_O32_FIRST_RUN",json.dumps({
              "executed":r["executed_cases"],
              "errors":r["error_cases"],
              "rowbag_mismatches":r["row_oracle_mismatch_cases"],
              "changed_rule_events":scope.get("recorded_rule_events"),
              "optimizer_suffixes":scope.get("post_finish_analysis_optimizer_suffixes"),
              "changed_suffixes":scope.get("changed_optimizer_suffixes"),
              "certified_changed_suffixes":scope.get("certified_changed_optimizer_suffixes"),
              "all_guards":gate,
              "strata":{k:dict(v) for k,v in sorted(cohorts.items())},
              "unknown_rule_types":scope.get("unknown_rules"),
          },sort_keys=True))
          if r["executed_cases"]!=32 or r["worker_exit_code"]!=0:
              raise SystemExit("O32_INCOMPLETE_EXECUTION")
          if r["missing_cases"] or r["error_cases"] or r["row_oracle_mismatch_cases"]:
              raise SystemExit("O32_CROSS_ENGINE_ORACLE_FAILURE")
          if scope["post_finish_analysis_optimizer_suffixes"]!=32:
              raise SystemExit("O32_MISSING_OPTIMIZER_SCOPE")
          if gate["status"]!="COMPLETE_ALL_GATES":
              raise SystemExit("O32_OBSERVER_INTEGRITY_FAILURE")
          '
      - name: Preserve only sanitized first-run O32 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queryproof-prospective-o32-first-run
          path: artifacts/queryproof_prospective_o32.json
          retention-days: 30
          if-no-files-found: warn
