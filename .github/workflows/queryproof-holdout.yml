name: QueryProof preregistered independent Spark holdout
on:
  push:
    branches: [research/queryproof-catalyst-trace-20261015]
    paths:
      - tools/queryproof_holdout/**
      - .github/workflows/queryproof-holdout.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_holdout
            tools/queryproof_instrumented
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install released Spark 4.2
        run: python -m pip install --no-cache-dir 'pyspark==4.2.0'
      - name: Compile independent AST tracer
        run: bash tools/queryproof_instrumented/build_overlay.sh
      - name: Run frozen holdout on real Spark and capture AST events
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/queryproof_holdout/run_holdout.py > artifacts/queryproof-holdout-ast.log 2>&1 || { tail -n 130 artifacts/queryproof-holdout-ast.log; exit 1; }
          if ! grep -q '^QUERYPROOF_AST' artifacts/queryproof-holdout-ast.log; then echo 'Missing real AST events'; exit 1; fi
          grep '^QUERYPROOF_HOLDOUT' artifacts/queryproof-holdout-ast.log || true
      - name: Score with unchanged development-locked AST heuristic
        run: python tools/queryproof_holdout/score_holdout.py
      - name: Preserve experiment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queryproof-preregistered-holdout-v1
          path: |
            artifacts/queryproof-holdout-ast.log
            artifacts/queryproof_holdout_observations.json
            artifacts/queryproof_holdout_score.json
          retention-days: 14
