name: "QueryProof interface hunt - pyarrow ORC round trip across versions"
on:
  push:
    branches:
      - research/queryproof-phase-local-independent-20261020
    paths:
      - tools/queryproof_interface/PYARROW_VERSIONS_REQUEST
permissions:
  contents: read
concurrency:
  group: queryproof-pyarrow-versions
  cancel-in-progress: false
jobs:
  roundtrip:
    # Public fork: GitHub-hosted only (never the self-hosted VM).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pyarrow: ['12.0.1', '15.0.2', '18.1.0', '21.0.0', '24.0.0', '26.0.0']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_interface
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Round trip
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "pyarrow==${{ matrix.pyarrow }}" "numpy<2"
          python -I tools/queryproof_interface/arrow_orc_roundtrip.py
