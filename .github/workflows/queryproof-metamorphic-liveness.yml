name: QueryProof 60-case seeded generated liveness confirmation
on:
  push:
    branches:
      - research/queryproof-generalized-liveness-20261020
    paths:
      - tools/queryproof_metamorphic_liveness_20261020/**
      - .github/workflows/queryproof-metamorphic-liveness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seeded-metamorphic-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_context_validator
            tools/queryproof_holdout_20261018
            tools/queryproof_external_postgresql_join_20261019
            tools/queryproof_metamorphic_liveness_20261020
            tools/queryproof_instrumented
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official PySpark 4.2.0
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==4.2.0
      - name: Instrument a disposable Spark Catalyst wheel
        run: bash tools/queryproof_instrumented/build_overlay.sh
      - name: Execute 60 frozen, unseen targeted SQL instances
        run: python -u tools/queryproof_metamorphic_liveness_20261020/run_metamorphic.py
      - name: Check complete metamorphic cohort and exact verifier identity
        if: always()
        run: |
          python -B -c '
          import json
          from pathlib import Path
          f = Path("artifacts/queryproof_metamorphic_liveness_20261020.json")
          if not f.exists():
              raise SystemExit("Missing frozen stress-test report")
          r = json.loads(f.read_text())
          p = r["generalized_column_liveness"]
          print("SEEDED_CASES", r["executed_cases"])
          print("SEEDED_EVENTS", r["trace"]["trace_events"])
          print("SEEDED_LIVENESS", p)
          print("SEEDED_OLD_UNION", r["union_coverage"]["union_statuses"])
          print("SEEDED_BY_RULE", r["union_coverage"]["by_rule"])
          print("SEEDED_RETRO_AGGREGATE_IDENTITY", r["posthoc_aggregate_identity"])
          print("SEEDED_MISMATCHES", r["row_oracle_mismatch_cases"])
          print("SEEDED_ERRORS", r["error_cases"])
          if p["status"] != "PROSPECTIVE_FROZEN_TARGETED_GENERATED_LIVENESS":
              raise SystemExit("Wrong targeted prospective classification")
          if not p["verifier_provenance"]["matches_frozen_checker"]:
              raise SystemExit("Generalized verifier was modified after freeze")
          if r["worker_exit_code"] != 0 or r["executed_cases"] != 60:
              raise SystemExit("Incomplete 60-case replay")
          if r["missing_cases"] or r["error_cases"] or r["row_oracle_mismatch_cases"]:
              raise SystemExit("Row-result error or cross-engine disagreement")
          if r["trace"]["trace_events"] <= 0:
              raise SystemExit("Missing optimizer transitions")
          if r["trace"]["decode_failures"] or r["trace"]["instrumentation_failures"]:
              raise SystemExit("Bad Catalyst trace capture")
          '
      - name: Save sanitized targeted proof scoreboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queryproof-seeded-metamorphic-targeted
          path: artifacts/queryproof_metamorphic_liveness_20261020.json
          if-no-files-found: warn
          retention-days: 14
