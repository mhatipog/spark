name: QueryProof Catalyst five-partition observer demand
on:
  push:
    branches: [research/queryproof-observer-lattice-20261018]
    paths:
      - tools/queryproof_observer_lattice/**
      - .github/workflows/queryproof-catalyst-observer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalyst-demand:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    strategy:
      fail-fast: false
      matrix:
        spark: ['4.0.1','4.2.0']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_observer_lattice
            tools/queryproof_prospective
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm exact observer partition proofs
        run: python -m unittest discover -s tools/queryproof_observer_lattice -p 'test_lattice.py' -v
      - name: Install unmodified Spark wheel
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==${{ matrix.spark }}
      - name: Automatically derive contexts from analyzed Spark expression trees
        run: python -u tools/queryproof_observer_lattice/run_catalyst_observer.py
      - name: Archive all extracted demands, UNKNOWNs and mismatches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queryproof-observer-${{ matrix.spark }}
          path: artifacts/queryproof_catalyst_observer_*.json
          retention-days: 14
          if-no-files-found: warn
