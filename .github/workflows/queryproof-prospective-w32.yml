name: QueryProof W32 first prospective v5 full optimizer suffix
on:
  push:
    branches:
      - research/queryproof-adversarial-tag-frame-20261020
    paths:
      - tools/queryproof_prospective_w_20261020/**
      - .github/workflows/queryproof-prospective-w32.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-frozen-w32:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_prospective_w_20261020
            tools/queryproof_join_filters_u_dev_20261020
            tools/queryproof_join_suffix_s_dev_20261020
            tools/queryproof_join_pruning_q_dev_20261020
            tools/queryproof_round_n_dev_20261020
            tools/queryproof_adversarial_20261020
            tools/queryproof_context_validator
            tools/queryproof_holdout_20261018
            tools/queryproof_external_postgresql_join_20261019
            tools/queryproof_grouping_repetition_round2_20261020
            tools/queryproof_composition_20261020
            tools/queryproof_scopes_20261020
            tools/queryproof_scopes_fresh_k_20261020
            tools/queryproof_state_witness_20261020
            tools/queryproof_state_frame_20261020
            tools/queryproof_instrumented
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Freeze exact W cohort and 15 verifier/data blobs BEFORE first W SQL
        run: |
          python -B -c '
          import ast, json, subprocess
          from pathlib import Path
          from collections import Counter
          folder=Path("tools/queryproof_prospective_w_20261020")
          m=json.loads((folder/"CASES.json").read_text())
          p=json.loads((folder/"PROTOCOL.json").read_text())
          assert m["benchmark_id"]==p["benchmark_id"]
          assert len(m["cases"])==p["required_case_count"]==32
          assert len({c["id"] for c in m["cases"]})==32
          assert Counter(c["group"] for c in m["cases"])==p["cohort_strata"]
          assert len({(c["source_file"],c["source_query_ordinal"]) for c in m["cases"]})==32
          assert len(set(c["family"] for c in m["cases"]))==p["cohort_family_count"]==8
          assert set(Counter(c["family"] for c in m["cases"]).values())=={4}
          assert all(len(set(c["sql"] for c in m["cases"] if c["family"]==fam))==2
              for fam in set(c["family"] for c in m["cases"]))
          assert p["prospectively_frozen_before_first_w_execution"]
          assert m["source"]["frozen_before_first_w_execution"]
          parent=ast.parse(Path("tools/queryproof_external_postgresql_join_20261019/run_external.py").read_text())
          required={n.slice.value for n in ast.walk(parent)
              if isinstance(n,ast.Subscript) and isinstance(n.value,ast.Name)
              and n.value.id=="protocol" and isinstance(n.slice,ast.Constant)
              and isinstance(n.slice.value,str)}
          assert required <= set(p),f"MISSING_PROTOCOL_FIELDS {sorted(required-set(p))}"
          assert len(p["frozen_verifier_commit"])==40
          assert len(p["frozen_git_blob_shas"])==15
          assert "tools/queryproof_prospective_w_20261020/CASES.json" in p["frozen_git_blob_shas"]
          for path,expected in p["frozen_git_blob_shas"].items():
              actual=subprocess.run(["git","hash-object",path],
                  capture_output=True,text=True,check=True).stdout.strip()
              assert actual==expected, f"CODE_OR_DATA_PIN_CHANGED {path}"
              if path.endswith(".py"): compile(Path(path).read_text(),path,"exec")
          print("QUERYPROOF_W32_FROZEN_BEFORE_SQL",len(m["cases"]),
                len(p["frozen_git_blob_shas"]), sorted(required))
          '
      - name: Check finite independent join and SQL-NULL adversarial control
        run: python -B tools/queryproof_join_filters_u_dev_20261020/test_join_filter_semantics.py
      - name: Install official Spark 4.2.0
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==4.2.0
      - name: Attach disposable source, frame, input, silent-rule and tag observers
        run: |
          python -B tools/queryproof_scopes_20261020/instrument_scopes.py
          python -B tools/queryproof_state_witness_20261020/instrument_state.py
          python -B tools/queryproof_state_frame_20261020/instrument_frame.py
          python -B tools/queryproof_adversarial_20261020/instrument_input_identity.py
          python -B tools/queryproof_adversarial_20261020/instrument_silent_rules.py
          python -B tools/queryproof_adversarial_20261020/instrument_tag_taxonomy.py
          bash tools/queryproof_instrumented/build_overlay.sh
      - name: FIRST irreversible W32 SQL scoring - no retune
        run: python -u tools/queryproof_prospective_w_20261020/run_w.py
      - name: Score strictly and preserve first-run UNKNOWNs
        if: always()
        run: |
          python -B -c '
          import json
          from pathlib import Path
          path=Path("artifacts/queryproof_prospective_w32.json")
          if not path.exists(): raise SystemExit("W32_REPORT_MISSING")
          r=json.loads(path.read_text())
          s=r["union_coverage"]["w32_full_suffix_first_run"]
          print("QUERYPROOF_W32_FIRST_RUN",json.dumps({
              "executed_cases":r["executed_cases"],
              "error_cases":r["error_cases"],
              "finite_bag_mismatch_cases":r["row_oracle_mismatch_cases"],
              "changed_suffixes":s["changed_optimizer_suffixes"],
              "v5_certified_full_suffixes":s["v5_certified_complete_changed_suffixes"],
              "family_counts":s["families"],
              "gate_statuses":s["gate_statuses"],
              "necessary_guard_counts":s["necessary_gate_counts"],
              "all_guard_statuses_complete":s["all_guard_statuses_complete"],
              "gate_counts_match":s["gate_counts_match_scope_candidates"],
              "per_case":s["cases"],
          },sort_keys=True))
          if r["executed_cases"]!=32 or r["worker_exit_code"]!=0:
              raise SystemExit("W32_INCOMPLETE_EXECUTION")
          if r["missing_cases"] or r["error_cases"] or r["row_oracle_mismatch_cases"]:
              raise SystemExit("W32_FINITE_ORACLE_FAILURE")
          if not s["all_guard_statuses_complete"]:
              raise SystemExit("W32_WITNESS_INTEGRITY_INCOMPLETE")
          '
      - name: Preserve immutable original W32 run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queryproof-prospective-w32-first-run
          path: artifacts/queryproof_prospective_w32.json
          retention-days: 30
          if-no-files-found: warn
