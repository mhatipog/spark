name: QueryProof prospective K hierarchical optimizer proof
on:
  push:
    branches:
      - research/queryproof-generalized-liveness-20261020
    paths:
      - tools/queryproof_scopes_fresh_k_20261020/**
      - .github/workflows/queryproof-prospective-scope-k.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prospective-k:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_context_validator
            tools/queryproof_holdout_20261018
            tools/queryproof_external_postgresql_join_20261019
            tools/queryproof_grouping_repetition_round2_20261020
            tools/queryproof_composition_20261020
            tools/queryproof_scopes_20261020
            tools/queryproof_scopes_fresh_k_20261020
            tools/queryproof_instrumented
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen hierarchical scope adversarial controls
        run: |
          python -B -m unittest discover -s tools/queryproof_scopes_20261020 \
            -p 'test_scope_ledger.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official PySpark 4.2.0
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==4.2.0
      - name: Instrument disposable Catalyst only
        run: |
          python -B tools/queryproof_scopes_20261020/instrument_scopes.py
          bash tools/queryproof_instrumented/build_overlay.sh
      - name: First run on frozen unseen K01-K48 data and SQL
        run: python -u tools/queryproof_scopes_fresh_k_20261020/run_k.py
      - name: Verify K execution and print sanitized prospective findings
        if: always()
        run: |
          python -B -c '
          import json
          from pathlib import Path
          p = Path("artifacts/queryproof_scope_prospective_k.json")
          if not p.exists():
              raise SystemExit("Missing prospective K output")
          report = json.loads(p.read_text())
          scopes = report["union_coverage"]["hierarchical_scope_ledger"]
          fields = ("status", "recorded_rule_events", "batch_scopes",
                    "executor_scopes", "changed_batches",
                    "certified_changed_batches", "changed_executors",
                    "certified_changed_executors",
                    "post_finish_analysis_optimizer_suffixes",
                    "changed_optimizer_suffixes",
                    "certified_changed_optimizer_suffixes",
                    "optimizer_suffix_reason_counts", "errors")
          print("QUERYPROOF_K_SCOPE", json.dumps({
              key: scopes.get(key) for key in fields}, sort_keys=True))
          print("QUERYPROOF_K_ROW_ERRORS", report["error_cases"])
          print("QUERYPROOF_K_ORACLE_MISMATCHES", report["row_oracle_mismatch_cases"])
          print("QUERYPROOF_K_TRACE_EVENTS", report["trace"]["trace_events"])
          print("QUERYPROOF_K_COMPLETED", report["executed_cases"])
          print("QUERYPROOF_K_FROZEN_METHODS", report["union_coverage"][
              "scope_verifier_pin_match"])
          if report["worker_exit_code"] != 0 or report["executed_cases"] != 48:
              raise SystemExit("Incomplete K prospective run")
          if report["error_cases"] or report["row_oracle_mismatch_cases"]:
              raise SystemExit("Spark/SQLite discrepancy in K cases")
          if scopes["status"] != "RETROSPECTIVE_EXACT_CATALYST_SCOPE_LEDGER":
              raise SystemExit("Unbalanced Catalyst scope markers")
          if scopes["recorded_rule_events"] != report["trace"]["trace_events"]:
              raise SystemExit("Changed-rule trace event mismatch")
          '
      - name: Archive sanitized prospective K results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queryproof-prospective-k-scope-proof
          path: artifacts/queryproof_scope_prospective_k.json
          retention-days: 14
          if-no-files-found: warn
