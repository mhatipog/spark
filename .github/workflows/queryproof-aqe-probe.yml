name: "QueryProof bug hunt - AQE one-row probe (default configuration)"
on:
  # The marker holds REPEATS.
  push:
    branches:
      - research/queryproof-phase-local-independent-20261020
    paths:
      - tools/queryproof_hunt_20261023/AQE_PROBE_REQUEST
permissions:
  contents: read
concurrency:
  group: queryproof-aqe-probe
  cancel-in-progress: false
jobs:
  probe:
    # Public fork: GitHub-hosted only (never the self-hosted VM).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pyspark: ['4.2.1']
        lqs_patch: ['none']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_hunt_20261023
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install PySpark and optionally patch LogicalQueryStage
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir pyspark==${{ matrix.pyspark }}
          if [ "${{ matrix.lqs_patch }}" = "spark-57956" ]; then bash tools/queryproof_hunt_20261023/patch_lqs.sh; fi
      - name: Probe
        run: |
          read REP < tools/queryproof_hunt_20261023/AQE_PROBE_REQUEST
          nproc
          python -B tools/queryproof_hunt_20261023/variant_probe.py 2>cbo_min.log || { grep -v ' WARN ' cbo_min.log | tail -40; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: aqe-probe-${{ matrix.pyspark }}-${{ matrix.lqs_patch }}
          path: |
            cbo_min.json
