name: QueryProof plan-derived ordering obligations
on:
  push:
    branches:
      - research/queryproof-plan-obligations-20261017
    paths:
      - tools/queryproof_plan_obligations/**
      - .github/workflows/queryproof-plan-obligations.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyzed-plan-obligations:
    name: Official PySpark ${{ matrix.spark }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        spark: ['4.0.1', '4.2.0']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_observed_contract
            tools/queryproof_plan_obligations
            tools/queryproof_prospective
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pure Python previous witness tests
        run: python -m unittest discover -s tools/queryproof_observed_contract -p 'test_contract.py'
      - name: Install unmodified official Spark
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==${{ matrix.spark }}
      - name: Extract observed result obligations without using manual labels
        run: python -u tools/queryproof_plan_obligations/run.py
      - name: Score frozen unrelated correctness bug families and controls
        run: python -u tools/queryproof_plan_obligations/cross_family.py
      - name: Preserve all results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queryproof-plan-${{ matrix.spark }}
          path: |
            artifacts/queryproof_plan_contracts_*.json
            artifacts/queryproof_cross_family_*.json
          if-no-files-found: warn
          retention-days: 14
