name: "QueryProof bug hunt - reproductions across Spark versions (DPP through UNION, CBO FilterEstimation, V2 variant pruning, ORC nested pushdown, aggregate pushdown over no rows)"
on:
  # The marker's content is ignored; pushing it runs the matrix.
  push:
    branches:
      - research/queryproof-phase-local-independent-20261020
    paths:
      - tools/queryproof_hunt_20261023/DPP_VERSIONS_REQUEST
permissions:
  contents: read
concurrency:
  group: queryproof-dpp-versions
  cancel-in-progress: false
jobs:
  released:
    # Public fork: GitHub-hosted only (never the self-hosted VM).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pyspark: ['pyspark>=3.5,<3.6', 'pyspark>=4.0,<4.1', 'pyspark>=4.1,<4.2', 'pyspark==4.2.1']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_hunt_20261023
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Probe
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "${{ matrix.pyspark }}"
          python -c "import pyspark; print('PYSPARK', pyspark.__version__)"
          python -B tools/queryproof_hunt_20261023/dpp_probe.py dpp.json 2>dpp.log || { grep -v ' WARN ' dpp.log | tail -40; exit 1; }
          python -B tools/queryproof_hunt_20261023/cbo_final.py 2>cbo.log || { grep -v ' WARN ' cbo.log | tail -40; exit 1; }
          python -B tools/queryproof_hunt_20261023/v2_probe.py 2>v2.log || { grep -v ' WARN ' v2.log | tail -20; true; }
          python -B tools/queryproof_hunt_20261023/dpp_default_probe.py 2>dd.log || { grep -v ' WARN ' dd.log | tail -20; true; }
          python -B tools/queryproof_hunt_20261023/orc_nested_probe.py 2>orc.log || { grep -v ' WARN ' orc.log | tail -20; true; }
          python -B tools/queryproof_hunt_20261023/agg_empty_probe.py 2>agg.log || { grep -v ' WARN ' agg.log | tail -20; true; }
          python -B tools/queryproof_hunt_20261023/partcount_probe.py 2>agg.log || { grep -v ' WARN ' agg.log | tail -20; true; }
          python -m pip install --disable-pip-version-check -q pyarrow==26.0.0
          python -B tools/queryproof_hunt_20261023/iface_probe.py 2>agg.log || { grep -v ' WARN ' agg.log | tail -20; true; }
          python -B tools/queryproof_hunt_20261023/orc_nested_read_probe.py 2>orcread.log || { grep -v ' WARN ' orcread.log | tail -20; true; }
  master:
    # Builds apache/spark master from source (about 40 minutes) and runs the same probe.
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_hunt_20261023
          path: qp
      - uses: actions/checkout@v4
        with:
          repository: apache/spark
          ref: master
          path: upstream
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Spark master (package, no tests)
        working-directory: upstream
        run: |
          git log -1 --format='SPARK_MASTER_COMMIT %H %cI %s'
          ./build/sbt -Phive -DskipTests package 2>&1 | tail -n 25
      - name: Probe against the master build
        run: |
          export SPARK_HOME="$GITHUB_WORKSPACE/upstream"
          export PYTHONPATH="$SPARK_HOME/python:$(ls $SPARK_HOME/python/lib/py4j-*-src.zip)"
          python -m pip install --disable-pip-version-check --no-cache-dir 'pyarrow>=18' pandas numpy
          python -c "import pyspark; print('PYSPARK', pyspark.__version__)"
          python -B qp/tools/queryproof_hunt_20261023/dpp_probe.py dpp.json 2>dpp.log || { grep -v ' WARN ' dpp.log | tail -60; exit 1; }
          python -B qp/tools/queryproof_hunt_20261023/cbo_final.py 2>cbo.log || { grep -v ' WARN ' cbo.log | tail -60; exit 1; }
          python -B qp/tools/queryproof_hunt_20261023/v2_probe.py 2>v2.log || { grep -v ' WARN ' v2.log | tail -40; exit 1; }
          python -B qp/tools/queryproof_hunt_20261023/dpp_default_probe.py 2>dd.log || { grep -v ' WARN ' dd.log | tail -40; exit 1; }
          python -B qp/tools/queryproof_hunt_20261023/orc_nested_probe.py 2>orc.log || { grep -v ' WARN ' orc.log | tail -40; exit 1; }
          python -B qp/tools/queryproof_hunt_20261023/agg_empty_probe.py 2>agg.log || { grep -v ' WARN ' agg.log | tail -40; exit 1; }
          python -B qp/tools/queryproof_hunt_20261023/partcount_probe.py 2>agg.log || { grep -v ' WARN ' agg.log | tail -40; exit 1; }
          python -B qp/tools/queryproof_hunt_20261023/iface_probe.py 2>agg.log || { grep -v ' WARN ' agg.log | tail -40; exit 1; }
          python -m pip install --disable-pip-version-check -q pyarrow==26.0.0
          python -B qp/tools/queryproof_hunt_20261023/orc_nested_read_probe.py 2>orcread.log || { grep -v ' WARN ' orcread.log | tail -40; exit 1; }
