name: Ordered projection experiment
on:
  push:
    branches: [research/spark-60319-ordered-projection]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [guard-only, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore the original guard for the control
        if: matrix.variant == 'guard-only'
        run: |
          git fetch --depth=1 origin 27c65ec372dc9afb75392c134bda45cb8394d0a5
          git checkout FETCH_HEAD -- sql/catalyst/src/main/scala/org/apache/spark/sql/catalyst/optimizer/PushProjectionThroughLimitAndOffset.scala
      - name: Test ordered projection cases
        run: |
          set -o pipefail
          build/sbt "sql/testOnly org.apache.spark.sql.DataFrameSubquerySuite -- -z \"ordered row boundaries:\"" 2>&1 | tee /tmp/ordered-projection.log
      - name: Test Catalyst rule
        if: matrix.variant == 'candidate' && always()
        run: |
          set -o pipefail
          build/sbt "catalyst/testOnly org.apache.spark.sql.catalyst.optimizer.PushProjectionThroughLimitAndOffsetSuite" 2>&1 | tee /tmp/ordered-catalyst.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ordered-projection-${{ matrix.variant }}
          path: /tmp/ordered-*.log
          retention-days: 3
