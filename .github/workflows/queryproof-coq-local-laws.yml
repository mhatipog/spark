name: QueryProof Coq narrow NULL-bag laws (development)
on:
  push:
    branches:
      - research/queryproof-phase-local-independent-20261020
    paths:
      - research/queryproof/proofs/*.v
      - .github/workflows/queryproof-coq-local-laws.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coq-kernel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/queryproof/proofs
      - name: Install upstream Ubuntu Coq package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq coq
          coqc --version
      - name: Reject admitted or axiomatic shortcuts
        run: |
          python3 -B -c '
          from pathlib import Path
          files=list(Path("research/queryproof/proofs").glob("*.v"))
          assert len(files)>=2
          source="\\n".join(p.read_text().lower() for p in files)
          assert "admitted." not in source and "admit." not in source
          assert "\naxiom " not in source and "\nparameter " not in source
          print("QUERYPROOF_COQ_NO_UNSAFE_AXIOMS=PASS")
          '
      - name: Compile all lemmas in Coq kernel
        run: |
          cd research/queryproof/proofs
          # Compile the dependency DAG before the remaining standalone files.
          for proof in QueryProofGuardCertificate.v QueryProofGuardPayload.v QueryProofGuardPair.v QueryProofGuardPairPayload.v; do
            coqc -q "$proof"
            test -f "${proof%.v}.vo"
          done
          for proof in *.v; do
            case "$proof" in
              QueryProofGuardCertificate.v|QueryProofGuardPayload.v|QueryProofGuardPair.v|QueryProofGuardPairPayload.v) continue ;;
            esac
            coqc -q "$proof"
            test -f "${proof%.v}.vo"
          done
          echo "QUERYPROOF_COQ_NARROW_NULL_BAG_LAWS=KERNEL_CHECKED"
