name: QueryProof contextual translation certificates
on:
  push:
    branches: [research/queryproof-contextual-translation-validation-20261018]
    paths:
      - tools/queryproof_context_validator/**
      - .github/workflows/queryproof-context-validator.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  context-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_context_validator
            tools/queryproof_instrumented
            tools/queryproof_prospective
            tools/queryproof_observer_lattice
            tools/queryproof_rule_provenance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install released Spark 4.2.0
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==4.2.0
      - name: Overlay existing rule-level AST tracer (disposable wheel only)
        run: bash tools/queryproof_instrumented/build_overlay.sh
      - name: Capture synthetic trace without publishing SQL literals
        run: |
          mkdir -p artifacts
          python -u tools/queryproof_rule_provenance/run_trace.py 2> artifacts/queryproof_raw_ast.log
      - name: Verify pure Python counterexample and fail-closed mutation controls
        run: python -m unittest discover -s tools/queryproof_context_validator -p 'test_context_proof.py' -v
      - name: Generate and independently validate smallest sufficient contextual rewrite guard
        run: python -m unittest discover -s tools/queryproof_context_validator -p 'test_context_proof.py' -v
      - name: Independently certify real Catalyst rule deltas using SQLite
        run: python -u tools/queryproof_context_validator/run_certificates.py artifacts/queryproof_raw_ast.log
      - name: Archive compact certificates, not raw trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queryproof-context-certificates-4.2
          path: artifacts/queryproof_contextual_rule_certificates.json
          if-no-files-found: warn
          retention-days: 21
