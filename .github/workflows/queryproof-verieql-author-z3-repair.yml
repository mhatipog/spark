name: QueryProof VeriEQL posthoc author's Z3 environment repair
on:
  push:
    branches:
      - research/queryproof-phase-local-independent-20261020
    paths:
      - .github/workflows/queryproof-verieql-author-z3-repair.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verieql-posthoc-author-z3-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/queryproof_verieql_controls_20261020
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin exact five FIRST-RUN cases, independent of repair
        run: |
          python -B -c '
          import json,subprocess
          from pathlib import Path
          p=json.loads(Path("tools/queryproof_verieql_controls_20261020/PROTOCOL.json").read_text())
          assert p["verieql_commit"]=="493cbb81000205e33b0623cfd1c39106fa035fae"
          assert p["input_git_blob_sha"]=="c63d2a8d0f9017dbf72c38082df02ea81588703e"
          assert subprocess.check_output(["git","hash-object",p["input_path"]],text=True).strip()==p["input_git_blob_sha"]
          print("VERIEQL_REPAIR_REUSING_FROZEN_FIVE",p["input_git_blob_sha"])
          '
      - name: Retrieve unchanged official VeriEQL code and pinned compatible solver
        run: |
          git clone --depth 1 https://github.com/VeriEQL/VeriEQL.git verieql
          git -C verieql fetch --depth 1 origin 493cbb81000205e33b0623cfd1c39106fa035fae
          git -C verieql checkout --detach 493cbb81000205e33b0623cfd1c39106fa035fae
          python -m pip install --disable-pip-version-check -r verieql/requirements.txt
          python -m pip install --disable-pip-version-check --force-reinstall 'z3-solver==4.12.2.0'
          test "$(git -C verieql hash-object z3py_libs/z3.py)" = "c64e6584ee24df2b83a701d2e6f017530162653f"
      - name: Follow official README Z3 customization (not a VeriEQL source change)
        run: |
          python -B -c '
          import inspect,pathlib,shutil,z3
          src=pathlib.Path("verieql/z3py_libs")
          dst=pathlib.Path(z3.__file__).resolve().parent
          for f in sorted(src.glob("*.py")):
              shutil.copyfile(f,dst/f.name)
          print("VERIEQL_OFFICIAL_Z3_FILES_COPIED",len(list(src.glob("*.py"))))
          '
          python -B -c '
          import inspect,z3
          print("VERIEQL_CUSTOM_Z3_SIGNATURES",inspect.signature(z3.And),inspect.signature(z3.Or),inspect.signature(z3.Sum))
          assert "ctx" in str(inspect.signature(z3.And))
          assert "ctx" in str(inspect.signature(z3.Or))
          assert "ctx" in str(inspect.signature(z3.Sum))
          '
      - name: Repeat unchanged five frozen bounded pairs, posthoc environment repair
        run: |
          mkdir -p artifacts
          cd verieql
          python -m parallel.cli_within_bound \
            -f "$GITHUB_WORKSPACE/tools/queryproof_verieql_controls_20261020/mini_pairs.jsonlines" \
            -s 3 -t 25 -c 1 -i 0 \
            -o "$GITHUB_WORKSPACE/artifacts/queryproof_verieql_author_z3_repair.jsonlines"
      - name: Report all outcomes with no relabeling of the first run
        if: always()
        run: |
          python -B -c '
          import json
          from pathlib import Path
          p=Path("artifacts/queryproof_verieql_author_z3_repair.jsonlines")
          if not p.is_file():
              print("VERIEQL_POSTHOC_OUTPUT_MISSING")
          else:
              records=[json.loads(x) for x in p.read_text().splitlines()]
              print("VERIEQL_POSTHOC_Z3_REPAIR",json.dumps([
                  {"index":r["index"],"name":r["file"],
                   "states":r["states"],"err":r.get("err")}
                  for r in records],sort_keys=True))
              assert len(records)==5
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queryproof-verieql-five-posthoc-author-z3-repair
          path: artifacts/queryproof_verieql_author_z3_repair.jsonlines
          retention-days: 30
          if-no-files-found: warn
