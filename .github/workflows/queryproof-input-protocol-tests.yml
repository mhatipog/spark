name: QueryProof input trace protocol adversarial unit checks
on:
  push:
    branches:
      - research/queryproof-adversarial-tag-frame-20261020
    paths:
      - tools/queryproof_adversarial_20261020/test_identity_trace_guard.py
      - .github/workflows/queryproof-input-protocol-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/queryproof_adversarial_20261020
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run adversarial missing, changed and forged marker tests
        run: |
          PYTHONPATH=tools/queryproof_adversarial_20261020 \
            python -B -m unittest discover \
            -s tools/queryproof_adversarial_20261020 \
            -p 'test_identity_trace_guard.py' -v
