name: QueryProof H hashed tag-key semantic taxonomy
on:
  push:
    branches:
      - research/queryproof-adversarial-tag-frame-20261020
    paths:
      - tools/queryproof_adversarial_20261020/instrument_tag_taxonomy.py
      - tools/queryproof_adversarial_20261020/tag_taxonomy_h.py
      - .github/workflows/queryproof-tag-taxonomy-h.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tag-meaning-retrospective-h:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_adversarial_20261020
            tools/queryproof_context_validator
            tools/queryproof_holdout_20261018
            tools/queryproof_external_postgresql_join_20261019
            tools/queryproof_grouping_repetition_round2_20261020
            tools/queryproof_composition_20261020
            tools/queryproof_scopes_20261020
            tools/queryproof_scopes_fresh_k_20261020
            tools/queryproof_state_witness_20261020
            tools/queryproof_state_frame_20261020
            tools/queryproof_instrumented
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Spark 4.2.0
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==4.2.0
      - name: Install disposable scope, state, frame, input and hashed tag observers
        run: |
          python -B tools/queryproof_scopes_20261020/instrument_scopes.py
          python -B tools/queryproof_state_witness_20261020/instrument_state.py
          python -B tools/queryproof_state_frame_20261020/instrument_frame.py
          python -B tools/queryproof_adversarial_20261020/instrument_input_identity.py
          python -B tools/queryproof_adversarial_20261020/instrument_tag_taxonomy.py
          bash tools/queryproof_instrumented/build_overlay.sh
      - name: Replay frozen H01-H48 for tag identity and type census only
        run: python -u tools/queryproof_adversarial_20261020/tag_taxonomy_h.py
      - name: Check complete trace and keep only sanitized taxonomy
        if: always()
        run: |
          python -B -c '
          import json
          from pathlib import Path
          p=Path("artifacts/queryproof_frames_H.json")
          if not p.exists():
              raise SystemExit("TAG_TAXONOMY_NOT_EXECUTED")
          report=json.loads(p.read_text())
          coverage=report["union_coverage"]
          audit=coverage["posthoc_frame_preservation"]["v6_tag_type_census"]
          scopes=coverage["hierarchical_scope_ledger"]
          print("QUERYPROOF_H_HASHED_TAG_TAXONOMY",json.dumps(audit,sort_keys=True))
          if report["executed_cases"]!=48 or report["worker_exit_code"]!=0:
              raise SystemExit("INCOMPLETE_H_REPLAY")
          if report["error_cases"] or report["row_oracle_mismatch_cases"]:
              raise SystemExit("ROW_ORACLE_MISMATCH")
          if audit["status"]!="COMPLETE_HASHED_TAG_CENSUS":
              raise SystemExit("INCOMPLETE_TAG_TAXONOMY")
          if audit["rule_records"]!=scopes["recorded_rule_events"]:
              raise SystemExit("EFFECTIVE_RULE_DENOMINATOR")
          '
      - name: Preserve sanitized retrospective inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queryproof-h-hashed-tag-taxonomy
          path: artifacts/queryproof_frames_H.json
          retention-days: 14
          if-no-files-found: warn
