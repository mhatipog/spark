name: QueryProof prospective frozen M48 adversarial validation
on:
  push:
    branches:
      - research/queryproof-adversarial-tag-frame-20261020
    paths:
      - tools/queryproof_prospective_m_20261020/**
      - .github/workflows/queryproof-prospective-m.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prospective-m-all-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_prospective_m_20261020
            tools/queryproof_adversarial_20261020
            tools/queryproof_context_validator
            tools/queryproof_holdout_20261018
            tools/queryproof_external_postgresql_join_20261019
            tools/queryproof_grouping_repetition_round2_20261020
            tools/queryproof_composition_20261020
            tools/queryproof_scopes_20261020
            tools/queryproof_scopes_fresh_k_20261020
            tools/queryproof_state_witness_20261020
            tools/queryproof_state_frame_20261020
            tools/queryproof_instrumented
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Freeze check for manifest and protocol before any SQL run
        run: |
          python -B -c '
          import json
          from collections import Counter
          from pathlib import Path
          p=Path("tools/queryproof_prospective_m_20261020")
          m=json.loads((p/"CASES.json").read_text())
          c=json.loads((p/"PROTOCOL.json").read_text())
          assert m["benchmark_id"]==c["benchmark_id"]
          assert len(m["cases"])==48==c["required_case_count"]
          assert len(set(x["id"] for x in m["cases"]))==48
          assert Counter(x["group"] for x in m["cases"])==c["cohort_strata"]
          assert all(len(x["tables"])==2 for x in m["cases"])
          assert c["prospectively_frozen_before_first_M_run"]
          print("QUERYPROOF_M_FREEZE=48_VALID_CASES_IN_2_PREREGISTERED_STRATA")
          '
      - name: Install official Spark 4.2.0
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==4.2.0
      - name: Attach disposable scope, state, frame, input, all-rule and tag-shape observers
        run: |
          python -B tools/queryproof_scopes_20261020/instrument_scopes.py
          python -B tools/queryproof_state_witness_20261020/instrument_state.py
          python -B tools/queryproof_state_frame_20261020/instrument_frame.py
          python -B tools/queryproof_adversarial_20261020/instrument_input_identity.py
          python -B tools/queryproof_adversarial_20261020/instrument_silent_rules.py
          python -B tools/queryproof_adversarial_20261020/instrument_tag_taxonomy.py
          bash tools/queryproof_instrumented/build_overlay.sh
      - name: First and only pristine M48 run under unchanged certificate implementations
        run: python -u tools/queryproof_prospective_m_20261020/run_m.py
      - name: Enforce complete executions, oracle, trace and evidence denominators
        if: always()
        run: |
          python -B -c '
          import json
          from pathlib import Path
          p=Path("artifacts/queryproof_prospective_m.json")
          if not p.exists():
              raise SystemExit("M48_REPORT_NOT_CREATED")
          report=json.loads(p.read_text())
          c=report["union_coverage"]
          scope=c["hierarchical_scope_ledger"]
          extra=c["m_frozen_full_observer_gate"]
          print("QUERYPROOF_M48_SANITIZED_RESULT",json.dumps({
              "cases":report["executed_cases"],
              "errors":len(report["error_cases"]),
              "oracle_mismatches":len(report["row_oracle_mismatch_cases"]),
              "changed_rule_events":scope.get("recorded_rule_events"),
              "postfinish_suffixes":scope.get("post_finish_analysis_optimizer_suffixes"),
              "changed_suffixes":scope.get("changed_optimizer_suffixes"),
              "structurally_certified_changed_suffixes":scope.get("certified_changed_optimizer_suffixes"),
              "necessary_gate_counts":extra.get("necessary_gate_candidate_counts"),
              "safe_intersection":extra.get("conservative_intersection"),
              "intersection_status":extra.get("intersection_status"),
              "gate_integrity":extra.get("status"),
          },sort_keys=True))
          if report["executed_cases"]!=48 or report["worker_exit_code"]!=0:
              raise SystemExit("INCOMPLETE_M48_EXECUTION")
          if report["missing_cases"] or report["error_cases"] or report["row_oracle_mismatch_cases"]:
              raise SystemExit("SPARK_SQLITE_ORACLE_FAILURE")
          if extra["status"]!="COMPLETE_ALL_GATES":
              raise SystemExit("M48_GATE_INTEGRITY_FAILURE")
          if scope["post_finish_analysis_optimizer_suffixes"]!=48:
              raise SystemExit("M48_MISSING_OPTIMIZER_CUT")
          '
      - name: Preserve only sanitized preregistered report, never raw Catalyst plans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queryproof-prospective-m48-frozen-first-run
          path: artifacts/queryproof_prospective_m.json
          retention-days: 30
          if-no-files-found: warn
