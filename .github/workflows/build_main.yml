name: "Build"

on:
  push:
    branches:
    - '**'
    # Research-only override on this branch; never alter upstream Spark CI.
    # Avoid scheduling the huge full Spark build for standalone QueryProof files.
    paths-ignore:
    - 'tools/queryproof_observed_contract/**'
    - '.github/workflows/queryproof-observed-contract.yml'

jobs:
  call-build-and-test:
    permissions:
      packages: write
    name: Run
    # Skip pushes to `master` on forks: the "Sync fork" button mirrors
    # apache/spark and would otherwise re-run the full build on every sync.
    # Fork experiment branch: the dedicated QueryProof workflow owns validation.
    # Avoid expensive inherited full-Spark builds; upstream Spark is unaffected.
    if: github.repository == 'apache/spark'
    uses: ./.github/workflows/build_and_test.yml
