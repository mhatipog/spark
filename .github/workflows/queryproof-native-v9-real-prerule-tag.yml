name: QueryProof V9 production ConstantFolding pre-rule state observation
on:
  push:
    branches:
      - research/queryproof-phase-local-independent-20261020
    paths:
      - tools/queryproof_posthoc_v9_20261020/**
      - .github/workflows/queryproof-native-v9-real-prerule-tag.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v9-actual-rule-pre-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_posthoc_v9_20261020
            tools/queryproof_posthoc_v8_20261020
            tools/queryproof_scopes_20261020
            tools/queryproof_instrumented
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Spark 4.2.0
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==4.2.0
      - name: Build exclusively ephemeral pre-execution source snapshot overlay
        run: |
          python -B tools/queryproof_scopes_20261020/instrument_scopes.py
          python -B tools/queryproof_posthoc_v8_20261020/instrument_v8_trace.py
          python -B tools/queryproof_posthoc_v9_20261020/instrument_v9_prerule_tag.py
          bash tools/queryproof_instrumented/build_overlay.sh
      - name: Compile native real ConstantFolding tag causality experiment
        run: |
          JARS=$(python -c 'import pyspark,os; print(os.path.join(os.path.dirname(pyspark.__file__),"jars"))')
          mkdir -p artifacts/queryproof_native_v9_classes
          java -Xmx3g -cp "$JARS/*" scala.tools.nsc.Main -usejavacp \
            -classpath "artifacts/queryproof_classes:$JARS/*" \
            -d artifacts/queryproof_native_v9_classes \
            tools/queryproof_posthoc_v9_20261020/QueryProofNativeV9PreRuleProductionTagWitness.scala
      - name: Confirm effective-event blindness and pre-rule hidden tag visibility
        run: |
          JARS=$(python -c 'import pyspark,os; print(os.path.join(os.path.dirname(pyspark.__file__),"jars"))')
          java -Xmx3g -cp "artifacts/queryproof_native_v9_classes:artifacts/queryproof_classes:$JARS/*" \
            org.apache.spark.sql.catalyst.optimizer.QueryProofNativeV9PreRuleProductionTagWitness
          echo QUERYPROOF_V9_NATIVE_REAL_PRE_RULE_TAG_TEST_COMPLETE
