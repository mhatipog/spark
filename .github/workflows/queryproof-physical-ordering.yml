name: QueryProof AQE physical outputOrdering verification research
on:
  push:
    branches: [research/queryproof-physical-ordering-20261016]
    paths:
      - tools/queryproof_physical/**
      - .github/workflows/queryproof-physical-ordering.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        spark: ['4.0.1','4.2.0']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_physical
            tools/queryproof_prospective/official_wheel_repro.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unmodified published Spark
        run: python -m pip install --no-cache-dir 'pyspark==${{ matrix.spark }}'
      - name: Compile external metadata inspector against published Spark
        run: bash tools/queryproof_physical/build_probe.sh
      - name: Inspect true final AQE SparkPlan ordering and partitioning
        shell: bash
        run: |
          set -euo pipefail
          export PYSPARK_SUBMIT_ARGS="--jars $PWD/artifacts/queryproof-ordering-probe.jar --driver-class-path $PWD/artifacts/queryproof-ordering-probe.jar pyspark-shell"
          python -u tools/queryproof_physical/run_probe.py > artifacts/ordering-inspection.log 2>&1 || { tail -n 120 artifacts/ordering-inspection.log; exit 1; }
          grep '^QUERYPROOF_ORDERING' artifacts/ordering-inspection.log || true
      - name: Upload unmodified Spark ordering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queryproof-physical-ordering-${{ matrix.spark }}
          path: |
            artifacts/queryproof_physical_ordering_*.json
            artifacts/ordering-inspection.log
            artifacts/queryproof-ordering-probe.jar
          retention-days: 14
