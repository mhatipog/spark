name: QueryProof Round N posthoc M failures triage
on:
  push:
    branches:
      - research/queryproof-adversarial-tag-frame-20261020
    paths:
      - tools/queryproof_round_n_dev_20261020/**
      - .github/workflows/queryproof-round-n-posthoc-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  posthoc-m-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_round_n_dev_20261020
            tools/queryproof_adversarial_20261020
            tools/queryproof_context_validator
            tools/queryproof_holdout_20261018
            tools/queryproof_external_postgresql_join_20261019
            tools/queryproof_grouping_repetition_round2_20261020
            tools/queryproof_composition_20261020
            tools/queryproof_scopes_20261020
            tools/queryproof_scopes_fresh_k_20261020
            tools/queryproof_state_witness_20261020
            tools/queryproof_state_frame_20261020
            tools/queryproof_instrumented
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Spark 4.2.0
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==4.2.0
      - name: Attach disposable Catalyst event and scope observers
        run: |
          python -B tools/queryproof_scopes_20261020/instrument_scopes.py
          python -B tools/queryproof_state_witness_20261020/instrument_state.py
          python -B tools/queryproof_state_frame_20261020/instrument_frame.py
          python -B tools/queryproof_adversarial_20261020/instrument_input_identity.py
          python -B tools/queryproof_adversarial_20261020/instrument_silent_rules.py
          python -B tools/queryproof_adversarial_20261020/instrument_tag_taxonomy.py
          bash tools/queryproof_instrumented/build_overlay.sh
      - name: Reexecute four already seen M cases as DEVELOPMENT ONLY
        run: python -u tools/queryproof_round_n_dev_20261020/run_dev.py
      - name: Read redacted checker reasons and enforce oracle
        if: always()
        run: |
          python -B -c '
          import json
          from pathlib import Path
          f=Path("artifacts/queryproof_round_n_posthoc_diagnostic.json")
          if not f.exists(): raise SystemExit("MISSING_DEV_DIAGNOSTIC")
          r=json.loads(f.read_text())
          d=r["union_coverage"]["round_n_posthoc_diagnostic"]
          print("QUERYPROOF_ROUND_N_DEV", json.dumps(d,sort_keys=True))
          assert r["executed_cases"]==4 and not r["error_cases"] and not r["row_oracle_mismatch_cases"]
          assert r["worker_exit_code"]==0
          assert d["status"]=="POSTHOC_DEVELOPMENT_ONLY_NO_PROSPECTIVE_CREDIT"
          '
      - name: Store sanitized posthoc diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queryproof-round-n-development-diagnostic
          path: artifacts/queryproof_round_n_posthoc_diagnostic.json
          retention-days: 14
          if-no-files-found: warn
