name: QueryProof real LogicalRDD JSON aliasing falsification
on:
  push:
    branches:
      - research/queryproof-adversarial-tag-frame-20261020
    paths:
      - tools/queryproof_adversarial_20261020/QueryProofLogicalRDDCollision.scala
      - tools/queryproof_adversarial_20261020/check_logical_rdd_false_identity.py
      - .github/workflows/queryproof-rdd-collision.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rdd-identity-negative-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_adversarial_20261020
            tools/queryproof_context_validator
            tools/queryproof_scopes_20261020
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Spark 4.2.0 and matching Scala compiler
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir pyspark==4.2.0
          JARS="$(python -c 'import os,pyspark; print(os.path.join(os.path.dirname(pyspark.__file__), "jars"))')"
          LIB="$(find "$JARS" -maxdepth 1 -name 'scala-library-2.13.*.jar' -print -quit)"
          test -n "$LIB"
          VERSION="$(basename "$LIB" | sed -e 's/^scala-library-//' -e 's/\.jar$//')"
          for lib in scala-reflect scala-compiler; do
            if test ! -f "$JARS/$lib-$VERSION.jar"; then
              curl --retry 3 -fsSL "https://repo.maven.apache.org/maven2/org/scala-lang/$lib/$VERSION/$lib-$VERSION.jar" -o "$JARS/$lib-$VERSION.jar"
            fi
          done
      - name: Run real JVM LogicalRDD collision using a disposable local Spark
        run: |
          JARS="$(python -c 'import os,pyspark; print(os.path.join(os.path.dirname(pyspark.__file__), "jars"))')"
          SUBMIT="$(python -c 'import os,pyspark; print(os.path.join(os.path.dirname(pyspark.__file__), "bin", "spark-submit"))')"
          mkdir -p artifacts/queryproof_rdd_collision_classes
          java -Xmx2g -cp "$JARS/*" scala.tools.nsc.Main -usejavacp \
            -classpath "$JARS/*" \
            -d artifacts/queryproof_rdd_collision_classes \
            tools/queryproof_adversarial_20261020/QueryProofLogicalRDDCollision.scala
          jar cf artifacts/queryproof-rdd-collision.jar -C artifacts/queryproof_rdd_collision_classes .
          "$SUBMIT" --master 'local[1]' --conf spark.ui.enabled=false \
            --class org.apache.spark.sql.catalyst.rules.QueryProofLogicalRDDCollision \
            artifacts/queryproof-rdd-collision.jar
      - name: Attempt to falsify the current scope and local proof checkers
        run: |
          python -B tools/queryproof_adversarial_20261020/check_logical_rdd_false_identity.py
