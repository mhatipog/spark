name: QueryProof certificate boundary tests
on:
  push:
    branches:
      - research/queryproof-certificate-boundary-hardening-20261019
    paths:
      - tools/queryproof_context_validator/equality_orbits.py
      - tools/queryproof_context_validator/test_equality_orbits.py
      - tools/queryproof_context_validator/join_prefilter_certificate.py
      - tools/queryproof_context_validator/test_join_prefilter.py
      - tools/queryproof_context_validator/project_pushdown_certificate.py
      - tools/queryproof_context_validator/test_project_pushdown.py
      - tools/queryproof_context_validator/compositional_project_frame_certificate.py
      - tools/queryproof_context_validator/test_compositional_project_frame.py
      - tools/queryproof_context_validator/join_filter_transport_certificate.py
      - tools/queryproof_context_validator/test_join_filter_transport.py
      - tools/queryproof_holdout_20261018/run_holdout.py
      - tools/queryproof_structural_confirmation_20261019/**
      - tools/queryproof_project_confirmation_20261019/**
      - tools/queryproof_compositional_confirmation_20261019/**
      - tools/queryproof_transport_confirmation_20261019/**
      - .github/workflows/queryproof-certificate-boundary.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-predicate-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/queryproof_context_validator
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact orbit certificates and reject malformed traces
        run: python -B -m unittest discover -s tools/queryproof_context_validator -p 'test_equality_orbits.py' -v
      - name: Verify inner join prefilter implication and reject unsafe scopes
        run: python -B -m unittest discover -s tools/queryproof_context_validator -p 'test_join_prefilter.py' -v
      - name: Verify identity/alias projection filter commutation
        run: python -B -m unittest discover -s tools/queryproof_context_validator -p 'test_project_pushdown.py' -v
      - name: Verify compositional pure projection frames
        run: python -B -m unittest discover -s tools/queryproof_context_validator -p 'test_compositional_project_frame.py' -v
      - name: Verify complete INNER JOIN predicate transport
        run: python -B -m unittest discover -s tools/queryproof_context_validator -p 'test_join_filter_transport.py' -v
  frozen-catalyst-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_context_validator
            tools/queryproof_holdout_20261018
            tools/queryproof_structural_confirmation_20261019
            tools/queryproof_project_confirmation_20261019
            tools/queryproof_compositional_confirmation_20261019
            tools/queryproof_transport_confirmation_20261019
            tools/queryproof_instrumented
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official released PySpark
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==4.2.0
      - name: Instrument disposable Catalyst wheel
        run: bash tools/queryproof_instrumented/build_overlay.sh
      - name: Replay unchanged frozen Filter and INNER JOIN corpus
        run: python -u tools/queryproof_holdout_20261018/run_holdout.py
      - name: Check sanitized certificate scoreboard
        if: always()
        run: |
          python -B -c '
          import json
          from pathlib import Path
          path = Path("artifacts/queryproof_holdout_20261018.json")
          if not path.exists():
              raise SystemExit("No sanitized scoreboard produced")
          report = json.loads(path.read_text())
          statuses = report["trace"]["all_events"]["statuses"]
          print("SPARK_VERSION", report["spark_version"])
          print("EXECUTED_CASES", report["executed_cases"])
          print("TRACE_EVENTS", report["trace"]["trace_events"])
          print("ALL_STATUSES", statuses)
          print("UNKNOWN_REASONS", report["trace"]["all_events"]["unknown_reasons"])
          from collections import Counter
          patterns = Counter()
          for row in report["trace"]["structural_diagnostics"]:
              patterns[(row["rule"], row["reason"], row["old_shape"], row["new_shape"])] += row["count"]
          for pattern, count in patterns.most_common(45):
              print("UNKNOWN_SHAPE", count, *pattern)
          print("EXPLORATORY_INNER_JOIN_GUARD", report["trace"]["exploratory_inner_join_guard"])
          print("EXPLORATORY_PROJECT_PUSHDOWN", report["trace"]["exploratory_project_pushdown"])
          print("EXPLORATORY_COMPOSITIONAL_FRAMES", report["trace"]["exploratory_compositional_frames"])
          print("EXPLORATORY_JOIN_TRANSPORT", report["trace"]["exploratory_join_filter_transport"])
          print("INFER_FILTER_METADATA_KEYS", report["trace"]["infer_filter_keysets"])
          print("ROW_ORACLE_MISMATCH_CASES", report["row_oracle_mismatch_cases"])
          if report["executed_cases"] != 18:
              raise SystemExit("Incomplete case execution")
          if report["row_oracle_mismatch_cases"]:
              raise SystemExit("Independent SQLite row oracle disagreement")
          if report["trace"]["decode_failures"] or report["trace"]["instrumentation_failures"]:
              raise SystemExit("Trace integrity failure")
          '
      - name: Replay separately frozen 18-query structural confirmation cohort
        run: python -u tools/queryproof_structural_confirmation_20261019/run_prospective.py
      - name: Check preregistered structural confirmation scoreboard
        if: always()
        run: |
          python -B -c '
          import json
          from pathlib import Path
          path = Path("artifacts/queryproof_structural_confirmation_20261019.json")
          if not path.exists():
              raise SystemExit("No confirmation scoreboard produced")
          report = json.loads(path.read_text())
          guard = report["trace"]["exploratory_inner_join_guard"]
          print("CONFIRMATION_SPARK_VERSION", report["spark_version"])
          print("CONFIRMATION_EXECUTED_CASES", report["executed_cases"])
          print("CONFIRMATION_TRACE_EVENTS", report["trace"]["trace_events"])
          print("CONFIRMATION_BASELINE_STATUSES", report["trace"]["all_events"]["statuses"])
          print("CONFIRMATION_JOIN_GUARD_CERTIFIED", guard["certified"])
          print("CONFIRMATION_JOIN_GUARD_CERTIFICATES", guard["certificates"])
          print("CONFIRMATION_JOIN_GUARD_UNKNOWN_REASONS", guard["unknown_reasons"])
          print("CONFIRMATION_EXPLORATORY_PROJECT_PUSHDOWN", report["trace"]["exploratory_project_pushdown"])
          print("CONFIRMATION_EXPLORATORY_FRAMES", report["trace"]["exploratory_compositional_frames"])
          print("CONFIRMATION_EXPLORATORY_JOIN_TRANSPORT", report["trace"]["exploratory_join_filter_transport"])
          print("CONFIRMATION_SQLITE_ROW_MISMATCHES", report["row_oracle_mismatch_cases"])
          if report["executed_cases"] != 18 or report["worker_exit_code"] != 0:
              raise SystemExit("Confirmation cohort did not complete")
          if report["row_oracle_mismatch_cases"]:
              raise SystemExit("Confirmation independent row-oracle disagreement")
          if report["trace"]["decode_failures"] or report["trace"]["instrumentation_failures"]:
              raise SystemExit("Confirmation trace integrity failure")
          if any(x["case"] in {"S13", "S14", "S15"} for x in guard["certificates"]):
              raise SystemExit("Outer join incorrectly certified")
          '
      - name: Replay preregistered 18-query randomized project-pushdown confirmation
        run: python -u tools/queryproof_project_confirmation_20261019/run_prospective.py
      - name: Check independently frozen project-pushdown scoreboard
        if: always()
        run: |
          python -B -c '
          import json
          from pathlib import Path
          path = Path("artifacts/queryproof_project_confirmation_20261019.json")
          if not path.exists():
              raise SystemExit("No prospective project scoreboard produced")
          report = json.loads(path.read_text())
          result = report["trace"]["exploratory_project_pushdown"]
          print("PROJECT_CONFIRMATION_SPARK_VERSION", report["spark_version"])
          print("PROJECT_CONFIRMATION_CASES", report["executed_cases"])
          print("PROJECT_CONFIRMATION_EVENTS", report["trace"]["trace_events"])
          print("PROJECT_CONFIRMATION_CERTIFIED", result["certified"])
          print("PROJECT_CONFIRMATION_CERTIFICATES", result["certificates"])
          print("PROJECT_CONFIRMATION_EXPLORATORY_FRAMES", report["trace"]["exploratory_compositional_frames"])
          print("PROJECT_CONFIRMATION_EXPLORATORY_JOIN_TRANSPORT", report["trace"]["exploratory_join_filter_transport"])
          print("PROJECT_CONFIRMATION_UNKNOWN_REASONS", result["unknown_reasons"])
          print("PROJECT_CONFIRMATION_PROJECT_ITEM_SHAPES", result["project_entry_shapes"])
          from collections import Counter
          pushes = Counter()
          for item in report["trace"]["structural_diagnostics"]:
              if item["rule"] == "PushDownPredicates":
                  pushes[(item["reason"], item["old_shape"], item["new_shape"])] += item["count"]
          for (reason, old, new), count in pushes.most_common(35):
              print("PROJECT_CONFIRMATION_PUSHDOWN_SHAPE", count, reason, old, new)
          print("PROJECT_CONFIRMATION_ROW_MISMATCHES", report["row_oracle_mismatch_cases"])
          if report["executed_cases"] != 18 or report["worker_exit_code"] != 0:
              raise SystemExit("Prospective projection cohort incomplete")
          if report["row_oracle_mismatch_cases"]:
              raise SystemExit("Independent Spark/SQLite row-bag disagreement")
          if report["trace"]["decode_failures"] or report["trace"]["instrumentation_failures"]:
              raise SystemExit("Trace decoding/instrumentation failure")
          if any(c["case"] in {"P16", "P17", "P18"} and
                 c["frame"] == "unchanged_inner_join" for c in result["certificates"]):
              raise SystemExit("Left-outer join was misidentified as exact inner join")
          '
      - name: Replay prospectively frozen 18-query compositional frame confirmation
        run: python -u tools/queryproof_compositional_confirmation_20261019/run_prospective.py
      - name: Check fresh compositional certificate scoreboard
        if: always()
        run: |
          python -B -c '
          import json
          from pathlib import Path
          path = Path("artifacts/queryproof_compositional_confirmation_20261019.json")
          if not path.exists():
              raise SystemExit("No fresh compositional scoreboard")
          report = json.loads(path.read_text())
          frames = report["trace"]["exploratory_compositional_frames"]
          print("FRAME_CONFIRMATION_SPARK", report["spark_version"])
          print("FRAME_CONFIRMATION_CASES", report["executed_cases"])
          print("FRAME_CONFIRMATION_EVENTS", report["trace"]["trace_events"])
          print("FRAME_CONFIRMATION_CERTIFIED", frames["certified"])
          print("FRAME_CONFIRMATION_CERTIFICATES", frames["certificates"])
          print("FRAME_CONFIRMATION_EXPLORATORY_JOIN_TRANSPORT", report["trace"]["exploratory_join_filter_transport"])
          print("FRAME_CONFIRMATION_UNKNOWN_REASONS", frames["unknown_reasons"])
          print("FRAME_CONFIRMATION_PROJECT_PUSHES", report["trace"]["exploratory_project_pushdown"]["certified"])
          print("FRAME_CONFIRMATION_JOIN_GUARDS", report["trace"]["exploratory_inner_join_guard"]["certified"])
          print("FRAME_CONFIRMATION_ORACLE_MISMATCHES", report["row_oracle_mismatch_cases"])
          if report["executed_cases"] != 18 or report["worker_exit_code"] != 0:
              raise SystemExit("Incomplete compositional confirmation")
          if report["row_oracle_mismatch_cases"]:
              raise SystemExit("Independent Spark/SQLite row-bag mismatch")
          if report["trace"]["decode_failures"] or report["trace"]["instrumentation_failures"]:
              raise SystemExit("Instrumentation or trace decode failure")
          if any(x["case"] in {"C17", "C18"} and
                 x["core"] == "inner_join_implied_filter_insertion"
                 for x in frames["certificates"]):
              raise SystemExit("Outer join incorrectly treated as inner")
          '
      - name: Replay fifth preregistered 18-query INNER JOIN predicate-transport cohort
        run: python -u tools/queryproof_transport_confirmation_20261019/run_prospective.py
      - name: Check prospective INNER JOIN transport certificate scoreboard
        if: always()
        run: |
          python -B -c '
          import json
          from pathlib import Path
          path = Path("artifacts/queryproof_transport_confirmation_20261019.json")
          if not path.exists():
              raise SystemExit("Missing transport confirmation scoreboard")
          report = json.loads(path.read_text())
          direct = report["trace"]["exploratory_join_filter_transport"]
          framed = report["trace"]["exploratory_compositional_frames"]
          transport_frames = [x for x in framed["certificates"] if x["core"] == "inner_join_filter_transport"]
          print("TRANSPORT_CONFIRMATION_SPARK", report["spark_version"])
          print("TRANSPORT_CONFIRMATION_CASES", report["executed_cases"])
          print("TRANSPORT_CONFIRMATION_EVENTS", report["trace"]["trace_events"])
          print("TRANSPORT_CONFIRMATION_DIRECT", direct["certified"])
          print("TRANSPORT_CONFIRMATION_DIRECT_DETAILS", direct["certificates"])
          print("TRANSPORT_CONFIRMATION_FRAMED", len(transport_frames))
          print("TRANSPORT_CONFIRMATION_FRAMED_DETAILS", transport_frames)
          print("TRANSPORT_CONFIRMATION_DIRECT_UNKNOWN", direct["unknown_reasons"])
          print("TRANSPORT_CONFIRMATION_FRAME_UNKNOWN", framed["unknown_reasons"])
          print("TRANSPORT_CONFIRMATION_ROW_MISMATCHES", report["row_oracle_mismatch_cases"])
          if report["executed_cases"] != 18 or report["worker_exit_code"] != 0:
              raise SystemExit("Incomplete fifth suite")
          if report["row_oracle_mismatch_cases"]:
              raise SystemExit("Independent Spark/SQLite row-bag disagreement")
          if report["trace"]["decode_failures"] or report["trace"]["instrumentation_failures"]:
              raise SystemExit("Catalyst trace integrity failure")
          '
      - name: Archive sanitized scoreboard only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queryproof-hardened-and-prospective-4.2
          path: |
            artifacts/queryproof_holdout_20261018.json
            artifacts/queryproof_structural_confirmation_20261019.json
            artifacts/queryproof_project_confirmation_20261019.json
            artifacts/queryproof_compositional_confirmation_20261019.json
            artifacts/queryproof_transport_confirmation_20261019.json
          if-no-files-found: warn
          retention-days: 14
