name: QueryProof test conservative AQE physical ordering source fix
on:
  push:
    branches: [research/queryproof-aqe-stage-sort-guard-20261016]
    paths:
      - tools/queryproof_guard/**
      - .github/workflows/queryproof-test-aqe-guard.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        spark: ['4.0.1','4.2.0']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_guard
            tools/queryproof_synthesis
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Spark runtime
        run: python -m pip install --no-cache-dir 'pyspark==${{ matrix.spark }}'
      - name: Independently check SQL generator and oracle
        run: python -m unittest discover -s tools/queryproof_synthesis -p 'test_generate.py' -v
      - name: Compile surgical guard into disposable Spark Catalyst wheel JAR
        run: bash tools/queryproof_guard/build_patch.sh
      - name: Run all 61 generated inputs twice without disabling the rule
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/queryproof_guard/test_patch.py > artifacts/queryproof-guard-tests.log 2>&1 || { tail -n 120 artifacts/queryproof-guard-tests.log; exit 1; }
          grep '^QUERYPROOF_PATCH_GUARD_SUMMARY' artifacts/queryproof-guard-tests.log
      - name: Preserve results including negative controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queryproof-experimental-stage-sort-guard-${{ matrix.spark }}
          path: |
            artifacts/queryproof_experimental_guard_*.json
            artifacts/queryproof-guard-tests.log
          retention-days: 14
