name: QueryProof automatic logical ordering obligations
on:
  push:
    branches: [research/queryproof-automatic-obligations-20261017]
    paths:
      - tools/queryproof_auto_obligations/**
      - .github/workflows/queryproof-auto-obligations.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        spark: ['4.0.1', '4.2.0']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_auto_obligations
            tools/queryproof_observed_contract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run no-Spark plan scope and expression ID unit tests
        run: python -m unittest discover -s tools/queryproof_auto_obligations -p 'test_extractor.py' -v
      - name: Run pre-existing semantic comparator tests
        run: python -m unittest discover -s tools/queryproof_observed_contract -p 'test_contract.py' -v
      - name: Install official unmodified PySpark
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==${{ matrix.spark }}
      - name: Auto-extract analyzed ORDER BY obligations on frozen SQL cases
        run: python -u tools/queryproof_auto_obligations/run_auto.py
      - name: Extract stage source and run bounded TopK checks with strict negative controls
        run: python -u tools/queryproof_auto_obligations/run_auto_topk.py
      - name: Investigate nested CTE boundary structure (Spark 4.2 only)
        if: matrix.spark == '4.2.0'
        run: python -u tools/queryproof_auto_obligations/trace_stage_shapes.py
      - name: Archive positive negatives and UNKNOWN observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queryproof-auto-order-${{ matrix.spark }}
          path: |
            artifacts/queryproof_auto_obligations_*.json
            artifacts/queryproof_auto_topk_*.json
            artifacts/queryproof_stage_shapes.json
          if-no-files-found: warn
          retention-days: 14
