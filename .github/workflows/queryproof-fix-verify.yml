name: "QueryProof bug hunt - verify a fix branch (Spark unit tests and end-to-end reproduction)"
on:
  # The marker holds: FIX_BRANCH SBT_TEST_SPEC REPRO_SCRIPT
  # e.g. research/queryproof-fix-n2-filterestimation-ndv-zero catalyst/testOnly*FilterEstimationSuite cbo_final.py
  push:
    branches:
      - research/queryproof-phase-local-independent-20261020
    paths:
      - tools/queryproof_hunt_20261023/FIX_VERIFY_REQUEST
permissions:
  contents: read
concurrency:
  group: queryproof-fix-verify
  cancel-in-progress: false
jobs:
  verify:
    # Public fork: GitHub-hosted only (never the self-hosted VM).
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Keep sbt within the hosted runner's memory (16 GB); sql/core tests need room for forks.
      SBT_OPTS: "-Xmx4g -Xss64m -XX:ReservedCodeCacheSize=512m"
    steps:
      - name: Free disk space (as Spark's own CI does)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_hunt_20261023
          path: qp
      - name: Read the request
        run: |
          read BRANCH TESTSPEC REPRO < qp/tools/queryproof_hunt_20261023/FIX_VERIFY_REQUEST
          # TESTSPEC uses '*' between the sbt command and each suite pattern and ',' between patterns,
          # e.g. sql/testOnly*SuiteA,*SuiteB -> "sql/testOnly *SuiteA *SuiteB"
          spec="${TESTSPEC//,/ }"; echo "TESTSPEC=${spec/\*/ *}" >> "$GITHUB_ENV"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"; echo "REPRO=$REPRO" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          path: fix
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit tests on the fix branch
        if: env.TESTSPEC != 'none'
        working-directory: fix
        run: |
          git log -2 --format='FIX_COMMIT %H %s'
          ./build/sbt "$TESTSPEC" > sbt.log 2>&1; status=$?
          grep -E "Tests:|passed|failed|\*\*\*|error\]|Test run|All tests" sbt.log | tail -n 40
          # Assertion messages of failed tests and debug lines printed by a test.
          grep -A 12 '\*\*\* FAILED \*\*\*' sbt.log | grep -v ' WARN ' | head -n 150
          grep 'QPDEBUG' sbt.log | head -n 40
          test "$status" = 0
      - name: Build the fix branch and run the end-to-end reproduction
        run: |
          cd fix && ./build/sbt -Phive -DskipTests package 2>&1 | tail -n 5 && cd ..
          export SPARK_HOME="$GITHUB_WORKSPACE/fix"
          export PYTHONPATH="$SPARK_HOME/python:$(ls $SPARK_HOME/python/lib/py4j-*-src.zip)"
          python -m pip install --disable-pip-version-check --no-cache-dir 'pyarrow>=18' pandas numpy
          python -B "qp/tools/queryproof_hunt_20261023/$REPRO" 2>repro.log || { grep -v ' WARN ' repro.log | tail -40; exit 1; }
