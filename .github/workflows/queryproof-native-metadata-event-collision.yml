name: QueryProof real RuleExecutor event with JSON-colliding metadata
on:
  push:
    branches:
      - research/queryproof-phase-local-independent-20261020
    paths:
      - tools/queryproof_posthoc_v7_20261020/QueryProofNativeMetadataTraceCollisionWitness.scala
      - .github/workflows/queryproof-native-metadata-event-collision.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-metadata-event:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_posthoc_v7_20261020
            tools/queryproof_scopes_20261020
            tools/queryproof_instrumented
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Spark 4.2.0
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==4.2.0
      - name: Rebuild pre-existing disposable QueryProof AST capture overlay
        run: |
          python -B tools/queryproof_scopes_20261020/instrument_scopes.py
          bash tools/queryproof_instrumented/build_overlay.sh
      - name: Compile native event-transport metadata falsifier
        run: |
          JARS=$(python -c 'import pyspark,os; print(os.path.join(os.path.dirname(pyspark.__file__),"jars"))')
          mkdir -p artifacts/queryproof_native_metadata_event_classes
          java -Xmx3g -cp "$JARS/*" scala.tools.nsc.Main -usejavacp \
            -classpath "artifacts/queryproof_classes:$JARS/*" \
            -d artifacts/queryproof_native_metadata_event_classes \
            tools/queryproof_posthoc_v7_20261020/QueryProofNativeMetadataTraceCollisionWitness.scala
          test -f artifacts/queryproof_native_metadata_event_classes/org/apache/spark/sql/catalyst/rules/QueryProofNativeMetadataTraceCollisionWitness.class
      - name: Verify effective rule produces indistinguishable recorded AST endpoints
        run: |
          JARS=$(python -c 'import pyspark,os; print(os.path.join(os.path.dirname(pyspark.__file__),"jars"))')
          java -Xmx3g -cp "artifacts/queryproof_native_metadata_event_classes:artifacts/queryproof_classes:$JARS/*" \
            org.apache.spark.sql.catalyst.rules.QueryProofNativeMetadataTraceCollisionWitness
          echo QUERYPROOF_NATIVE_METADATA_EVENT_TRANSPORT_TEST_COMPLETE
