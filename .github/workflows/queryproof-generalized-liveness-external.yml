name: QueryProof generalized liveness independent DuckDB replay
on:
  push:
    branches:
      - research/queryproof-generalized-liveness-20261020
    paths:
      - tools/queryproof_external_duckdb_generalized_liveness_20261020/**
      - tools/queryproof_external_postgresql_join_20261019/run_external.py
      - .github/workflows/queryproof-generalized-liveness-external.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new-independent-sql-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_context_validator
            tools/queryproof_holdout_20261018
            tools/queryproof_external_postgresql_join_20261019
            tools/queryproof_external_duckdb_column_liveness_20261019
            tools/queryproof_external_duckdb_generalized_liveness_20261020
            tools/queryproof_instrumented
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Apache Spark Python release
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==4.2.0
      - name: Instrument disposable Catalyst wheel
        run: bash tools/queryproof_instrumented/build_overlay.sh
      - name: Execute prospectively frozen unused DuckDB SQL cases
        run: python -u tools/queryproof_external_duckdb_generalized_liveness_20261020/run_generalized.py
      - name: Validate complete frozen provenance and audit proof abstentions
        if: always()
        run: |
          python -B -c '
          import json
          from pathlib import Path
          file = Path("artifacts/queryproof_duckdb_generalized_liveness_20261020.json")
          if not file.exists():
              raise SystemExit("Missing frozen generalized cohort report")
          r = json.loads(file.read_text())
          p = r["generalized_column_liveness"]
          print("GENERALIZED_CASES", r["executed_cases"])
          print("GENERALIZED_TRACE_EVENTS", r["trace"]["trace_events"])
          print("GENERALIZED_RULE_EVENTS", p["named_column_pruning_events"])
          print("GENERALIZED_PROOF", p)
          print("GENERALIZED_ERRORS", r["error_cases"])
          print("GENERALIZED_MISMATCHES", r["row_oracle_mismatch_cases"])
          if p["status"] != "RETROSPECTIVE_FIXTURE_REPAIR_DIAGNOSTIC":
              raise SystemExit("Repaired fixture must be labeled non-prospective")
          if not p["verifier_provenance"]["matches_frozen_checker"]:
              raise SystemExit("Verifier git blob differs from frozen pin")
          if r["worker_exit_code"] != 0 or r["executed_cases"] != 16:
              raise SystemExit("Incomplete external SQL cohort")
          if r["missing_cases"] or r["error_cases"] or r["row_oracle_mismatch_cases"]:
              raise SystemExit("Cross-engine correctness failure")
          if r["trace"]["decode_failures"] or r["trace"]["instrumentation_failures"]:
              raise SystemExit("Catalyst trace failure")
          if r["trace"]["trace_events"] <= 0:
              raise SystemExit("No optimizer events recorded")
          '
      - name: Diagnose previously observed A10-style exception (no holdout credit)
        run: python -u tools/queryproof_external_duckdb_generalized_liveness_20261020/run_generalized_old_A_posthoc.py
      - name: Audit previously seen A cohort separately
        if: always()
        run: |
          python -B -c '
          import json
          from pathlib import Path
          f = Path("artifacts/queryproof_generalized_old_A_replay_DIAGNOSTIC.json")
          if not f.exists():
              raise SystemExit("Missing prior A diagnostic report")
          r = json.loads(f.read_text())
          p = r["generalized_column_liveness"]
          print("POSTHOC_OLD_A_CASES", r["executed_cases"])
          print("POSTHOC_OLD_A_EVENTS", r["trace"]["trace_events"])
          print("POSTHOC_OLD_A_GENERALIZED", p)
          print("POSTHOC_OLD_A_FROZEN_ORIGINAL", r["retrospective_column_liveness"])
          if p["status"] != "RETROSPECTIVE_UNPINNED":
              raise SystemExit("No posthoc proof may be called prospective")
          if r["executed_cases"] != 15 or r["worker_exit_code"] != 0:
              raise SystemExit("Incomplete old A retrospective cohort")
          if r["error_cases"] or r["row_oracle_mismatch_cases"]:
              raise SystemExit("Cross-engine discrepancy in old A replay")
          if r["trace"]["decode_failures"] or r["trace"]["instrumentation_failures"]:
              raise SystemExit("Incomplete old A diagnostic trace")
          '
      - name: Archive sanitized independent-protocol scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queryproof-generalized-liveness-repaired-diagnostic
          path: |
            artifacts/queryproof_duckdb_generalized_liveness_20261020.json
            artifacts/queryproof_generalized_old_A_replay_DIAGNOSTIC.json
          if-no-files-found: warn
          retention-days: 14
