name: QueryProof native Spark 4.2 source-bound metadata frame
on:
  push:
    branches:
      - research/queryproof-phase-local-independent-20261020
    paths:
      - tools/queryproof_posthoc_v7_20261020/QueryProofNativeSourceBoundFrameWitness.scala
      - .github/workflows/queryproof-native-source-bound-frame.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/queryproof_posthoc_v7_20261020
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Spark 4.2.0 JVM runtime
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==4.2.0
      - name: Compile native fragment-specific lossless field extractor
        run: |
          JARS=$(python -c 'import pyspark,os; print(os.path.join(os.path.dirname(pyspark.__file__),"jars"))')
          mkdir -p artifacts/queryproof_native_source_frame_classes
          java -Xmx3g -cp "$JARS/*" scala.tools.nsc.Main -usejavacp \
            -classpath "$JARS/*" \
            -d artifacts/queryproof_native_source_frame_classes \
            tools/queryproof_posthoc_v7_20261020/QueryProofNativeSourceBoundFrameWitness.scala
          test -f artifacts/queryproof_native_source_frame_classes/org/apache/spark/sql/catalyst/expressions/QueryProofNativeSourceBoundFrameWitness.class
      - name: Test metadata swap collision, path identity and UNKNOWN control
        run: |
          JARS=$(python -c 'import pyspark,os; print(os.path.join(os.path.dirname(pyspark.__file__),"jars"))')
          java -Xmx3g -cp "artifacts/queryproof_native_source_frame_classes:$JARS/*" \
            org.apache.spark.sql.catalyst.expressions.QueryProofNativeSourceBoundFrameWitness
          echo QUERYPROOF_NATIVE_SOURCE_BOUND_FRAME_COMPLETE
