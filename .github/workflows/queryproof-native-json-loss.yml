name: QueryProof native Spark 4.2 Catalyst JSON erasure controls
on:
  push:
    branches:
      - research/queryproof-phase-local-independent-20261020
    paths:
      - tools/queryproof_posthoc_v7_20261020/QueryProofNativeJsonLossWitness.scala
      - .github/workflows/queryproof-native-json-loss.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-json-loss:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/queryproof_posthoc_v7_20261020
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official pinned Spark 4.2.0 unmodified runtime
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==4.2.0
      - name: Compile against actual Spark JVM jars
        run: |
          JARS=$(python -c 'import pyspark,os; print(os.path.join(os.path.dirname(pyspark.__file__),"jars"))')
          mkdir -p artifacts/queryproof_native_json_classes
          java -Xmx3g -cp "$JARS/*" scala.tools.nsc.Main -usejavacp \
            -classpath "$JARS/*" \
            -d artifacts/queryproof_native_json_classes \
            tools/queryproof_posthoc_v7_20261020/QueryProofNativeJsonLossWitness.scala
          test -f artifacts/queryproof_native_json_classes/org/apache/spark/sql/catalyst/expressions/QueryProofNativeJsonLossWitness.class
      - name: Run real Catalyst metadata-erasure and identity positive controls
        run: |
          JARS=$(python -c 'import pyspark,os; print(os.path.join(os.path.dirname(pyspark.__file__),"jars"))')
          java -Xmx3g -cp "artifacts/queryproof_native_json_classes:$JARS/*" \
            org.apache.spark.sql.catalyst.expressions.QueryProofNativeJsonLossWitness
          echo QUERYPROOF_NATIVE_CATALYST_JSON_LOSS_EXPERIMENT_COMPLETED
