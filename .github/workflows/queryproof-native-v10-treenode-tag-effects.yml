name: QueryProof V10 Spark source-site tag mutation observation
on:
  push:
    branches:
      - research/queryproof-phase-local-independent-20261020
    paths:
      - tools/queryproof_posthoc_v10_20261020/**
      - .github/workflows/queryproof-native-v10-treenode-tag-effects.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v10-native-treenode-effect-log:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_posthoc_v10_20261020
            tools/queryproof_posthoc_v9_20261020
            tools/queryproof_posthoc_v8_20261020
            tools/queryproof_scopes_20261020
            tools/queryproof_instrumented
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Spark 4.2.0
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==4.2.0
      - name: Obtain exact upstream Spark TreeNode source and verify pin before edits
        run: |
          mkdir -p artifacts/queryproof_v10_source
          curl --retry 3 -fsSL \
            https://raw.githubusercontent.com/apache/spark/v4.2.0/sql/catalyst/src/main/scala/org/apache/spark/sql/catalyst/trees/TreeNode.scala \
            -o artifacts/queryproof_v10_source/TreeNode.scala
          python -B tools/queryproof_posthoc_v10_20261020/instrument_official_treenode.py
      - name: Build existing disposable V9 RuleExecutor overlay
        run: |
          python -B tools/queryproof_scopes_20261020/instrument_scopes.py
          python -B tools/queryproof_posthoc_v8_20261020/instrument_v8_trace.py
          python -B tools/queryproof_posthoc_v9_20261020/instrument_v9_prerule_tag.py
          bash tools/queryproof_instrumented/build_overlay.sh
      - name: Compile pinned source-site TreeNode tag hooks into disposable Catalyst
        run: |
          JARS=$(python -c 'import pyspark,os; print(os.path.join(os.path.dirname(pyspark.__file__),"jars"))')
          mkdir -p artifacts/queryproof_v10_classes
          java -Xmx3g -cp "$JARS/*" scala.tools.nsc.Main -usejavacp \
            -classpath "artifacts/queryproof_classes:$JARS/*" \
            -d artifacts/queryproof_v10_classes \
            artifacts/queryproof_v10_source/TreeNode.scala
          test -f artifacts/queryproof_v10_classes/org/apache/spark/sql/catalyst/trees/TreeNode.class
          test -f artifacts/queryproof_v10_classes/org/apache/spark/sql/catalyst/trees/QueryProofTreeNodeTagEffects.class
          CATALYST=$(find "$JARS" -maxdepth 1 -name 'spark-catalyst_2.13-*.jar' | head -n 1)
          test -n "$CATALYST"
          jar uf "$CATALYST" -C artifacts/queryproof_v10_classes .
          echo QUERYPROOF_V10_OFFICIAL_TREENODE_SOURCE_PATCH_COMPILED
      - name: Compile real source tag mutation tests
        run: |
          JARS=$(python -c 'import pyspark,os; print(os.path.join(os.path.dirname(pyspark.__file__),"jars"))')
          mkdir -p artifacts/queryproof_v10_native_witnesses
          java -Xmx3g -cp "$JARS/*" scala.tools.nsc.Main -usejavacp \
            -classpath "artifacts/queryproof_classes:artifacts/queryproof_v10_classes:$JARS/*" \
            -d artifacts/queryproof_v10_native_witnesses \
            tools/queryproof_posthoc_v10_20261020/QueryProofNativeV10TreeNodeMutationWitness.scala
      - name: Verify native production tag, transient and bulk-UNKNOWN controls
        run: |
          JARS=$(python -c 'import pyspark,os; print(os.path.join(os.path.dirname(pyspark.__file__),"jars"))')
          java -Xmx3g -cp "artifacts/queryproof_v10_native_witnesses:artifacts/queryproof_v10_classes:artifacts/queryproof_classes:$JARS/*" \
            org.apache.spark.sql.catalyst.optimizer.QueryProofNativeV10TreeNodeMutationWitness
          echo QUERYPROOF_V10_NATIVE_SOURCE_SITE_TAG_TEST_COMPLETE
