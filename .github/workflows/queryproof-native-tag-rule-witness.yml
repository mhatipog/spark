name: QueryProof native Spark 4.2 tag-only RuleExecutor capture adversaries
on:
  push:
    branches:
      - research/queryproof-phase-local-independent-20261020
    paths:
      - tools/queryproof_posthoc_v7_20261020/QueryProofNativeInPlaceTagWitness.scala
      - .github/workflows/queryproof-native-tag-rule-witness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-tag-only-rule:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_posthoc_v7_20261020
            tools/queryproof_scopes_20261020
            tools/queryproof_instrumented
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned official Spark 4.2.0
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==4.2.0
      - name: Instrument disposable RuleExecutor and build Catalyst overlay
        run: |
          python -B tools/queryproof_scopes_20261020/instrument_scopes.py
          bash tools/queryproof_instrumented/build_overlay.sh
      - name: Compile native three-rule falsifier against the instrumented Scala sources
        run: |
          JARS=$(python -c 'import pyspark,os; print(os.path.join(os.path.dirname(pyspark.__file__),"jars"))')
          mkdir -p artifacts/queryproof_native_tag_classes
          java -Xmx3g -cp "$JARS/*" scala.tools.nsc.Main -usejavacp \
            -classpath "artifacts/queryproof_classes:$JARS/*" \
            -d artifacts/queryproof_native_tag_classes \
            tools/queryproof_posthoc_v7_20261020/QueryProofNativeInPlaceTagWitness.scala
          test -f artifacts/queryproof_native_tag_classes/org/apache/spark/sql/catalyst/rules/QueryProofNativeInPlaceTagWitness.class
      - name: Run native Spark in-place, transient, and positive-control tests
        run: |
          JARS=$(python -c 'import pyspark,os; print(os.path.join(os.path.dirname(pyspark.__file__),"jars"))')
          java -Xmx3g -cp "artifacts/queryproof_native_tag_classes:artifacts/queryproof_classes:$JARS/*" \
            org.apache.spark.sql.catalyst.rules.QueryProofNativeInPlaceTagWitness
          echo QUERYPROOF_NATIVE_TAG_ONLY_VALIDATED_REAL_CATALYST_4_2_0
