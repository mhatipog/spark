name: QueryProof V8 source-bound optimizer event falsification
on:
  push:
    branches:
      - research/queryproof-phase-local-independent-20261020
    paths:
      - tools/queryproof_posthoc_v8_20261020/**
      - .github/workflows/queryproof-native-v8-source-bound-event.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v8-native-source-bound-event:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/queryproof_posthoc_v8_20261020
            tools/queryproof_scopes_20261020
            tools/queryproof_instrumented
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Spark 4.2.0
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyspark==4.2.0
      - name: Instrument ONLY disposable source tree
        run: |
          python -B tools/queryproof_scopes_20261020/instrument_scopes.py
          python -B tools/queryproof_posthoc_v8_20261020/instrument_v8_trace.py
          bash tools/queryproof_instrumented/build_overlay.sh
      - name: Compile native source-bound effective event witnesses
        run: |
          JARS=$(python -c 'import pyspark,os; print(os.path.join(os.path.dirname(pyspark.__file__),"jars"))')
          mkdir -p artifacts/queryproof_native_v8_classes
          java -Xmx3g -cp "$JARS/*" scala.tools.nsc.Main -usejavacp \
            -classpath "artifacts/queryproof_classes:$JARS/*" \
            -d artifacts/queryproof_native_v8_classes \
            tools/queryproof_posthoc_v8_20261020/QueryProofNativeV8EventWitness.scala
      - name: Verify real Spark metadata source frame and unsupported UNKNOWN
        run: |
          JARS=$(python -c 'import pyspark,os; print(os.path.join(os.path.dirname(pyspark.__file__),"jars"))')
          java -Xmx3g -cp "artifacts/queryproof_native_v8_classes:artifacts/queryproof_classes:$JARS/*" \
            org.apache.spark.sql.catalyst.rules.QueryProofNativeV8EventWitness
          echo QUERYPROOF_V8_NATIVE_SOURCE_BOUND_EVENT_TEST_COMPLETE
